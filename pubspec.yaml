name: flml_internet_checker
description: A zero-dependency, highly customizable internet connectivity checker for Flutter. Detects real internet access (not just Wi-Fi), with blocking screens, banners, route exclusions and WASM support.
version: 4.0.0
homepage: https://github.com/NiTHiN6282/flml_internet_checker
repository: https://github.com/NiTHiN6282/flml_internet_checker
issue_tracker: https://github.com/NiTHiN6282/flml_internet_checker/issues

topics:
  - connectivity
  - internet
  - network
  - offline
  - connection

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
